<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Gallery · Erik Sjaastad</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* One 3D room. Chrome floats in the corners like /memory/. */
:root {
  --bg: #151417; --ink: #f3ebe4; --muted: #9a8f88; --neon: #ff6a00; --line: #3a3539;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--display); overflow: hidden; }
#stage { position: fixed; inset: 0; } #stage canvas { display: block; touch-action: none; }
.chrome { position: fixed; z-index: 2; }
#title { top: max(16px, env(safe-area-inset-top)); left: 18px; pointer-events: none; }
#title h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; } #title p { margin: 2px 0 0; font: 12px var(--mono); color: var(--muted); }
#home { top: max(14px, env(safe-area-inset-top)); right: 16px; font-size: 14px; color: var(--ink); text-decoration: none; background: rgba(21,20,23,.6); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; }
#home:hover { border-color: var(--neon); color: var(--neon); }
#hint { left: 18px; bottom: max(16px, env(safe-area-inset-bottom)); font: 12px var(--mono); color: var(--muted); pointer-events: none; transition: opacity .4s; }
#caption { left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translate(-50%, 12px); opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; text-align: center; width: min(92vw, 520px); }
#caption b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -.02em; } #caption span { font: 13px var(--mono); color: #ffc46b; }
body.focused #caption { opacity: 1; transform: translate(-50%, 0); } body.focused #hint { opacity: 0; }  /* both sit at the bottom */
@media (hover: none) { #hint { display: none; } }
</style>
<div id="stage"></div>
<header id="title" class="chrome"><h1>The gallery</h1><p>the room is up · the art is on its way</p></header>
<a id="home" class="chrome" href="/">Home</a>
<div id="hint" class="chrome">drag to look · scroll or WASD to walk · right-drag to slide · Q/E to turn · click a piece to walk to it</div>
<div id="caption" class="chrome" aria-live="polite"><b></b><span></span></div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";
import { walker } from "./walk.js";

// Room: x -6..6, floor y 0, ceiling y 5, entrance z +6, back wall z -10.
const W = 6, H = 5, FRONT = 6, BACK = -10;

let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (err) { document.querySelector("#title p").textContent = "this room needs WebGL, which this browser could not start"; throw err; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById("stage").appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#151417");
scene.fog = new THREE.Fog("#151417", 16, 34);
scene.add(new THREE.HemisphereLight("#d8d0ff", "#3a2616", 1.1));

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 60);
camera.rotation.order = "YXZ";  // turn, then tilt the head: no roll
// portrait phones: widen the vertical FOV so both side walls stay in view
function fit() {
  camera.aspect = innerWidth / innerHeight;
  const half = Math.atan(Math.tan(THREE.MathUtils.degToRad(42)) / camera.aspect);
  camera.fov = THREE.MathUtils.clamp(2 * THREE.MathUtils.radToDeg(half), 60, 100);
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
fit();
addEventListener("resize", fit);

function checker() {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d");
  g.fillStyle = "#d8d0c2"; g.fillRect(0, 0, 256, 256);
  g.fillStyle = "#141418"; g.fillRect(128, 0, 128, 128); g.fillRect(0, 128, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 8); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(2 * W, FRONT - BACK),
  new THREE.MeshStandardMaterial({ map: checker(), roughness: 0.32, metalness: 0.1 }));
floor.rotation.x = -Math.PI / 2; floor.position.z = (FRONT + BACK) / 2; floor.receiveShadow = true; scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({ color: "#3a3840", roughness: 0.9 });
function wall(w, h, x, y, z, ry) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
  m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; scene.add(m);
}
for (const side of [-1, 1]) wall(FRONT - BACK, H, side * W, H / 2, (FRONT + BACK) / 2, -side * Math.PI / 2);
wall(2 * W, H, 0, H / 2, BACK, 0);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(2 * W, FRONT - BACK), new THREE.MeshStandardMaterial({ color: "#121115" }));
ceil.rotation.x = Math.PI / 2; ceil.position.set(0, H, (FRONT + BACK) / 2); scene.add(ceil);
// neon baseboard in the site's orange along both side walls
const glow = new THREE.MeshBasicMaterial({ color: "#ff6a00" });
for (const x of [-W + 0.01, W - 0.01]) {
  const s = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.04, FRONT - BACK), glow); s.position.set(x, 0.02, (FRONT + BACK) / 2); scene.add(s);
}
// back wall wash so the far end of the room doesn't fall into black
const wash = new THREE.SpotLight("#c9b8ff", 30, 20, 0.7, 0.9, 1.2);
wash.position.set(0, H - 0.2, 0); wash.target.position.set(0, 1.5, BACK); scene.add(wash, wash.target);

function spot(target, from, intensity, angle) {
  const s = new THREE.SpotLight("#ffe2bf", intensity, 14, angle, 0.55, 1.6);
  s.position.copy(from); s.target.position.copy(target);
  s.castShadow = true; s.shadow.mapSize.set(512, 512); s.shadow.bias = -0.0005;
  scene.add(s, s.target);
}
// a piece you can click: where to stand, what to look at, and its caption
const pieces = [];
function piece(objs, name, note, stand, look) { for (const o of objs) { o.userData = { name, note, stand, look }; pieces.push(o); } }
const brass = new THREE.MeshStandardMaterial({ color: "#b8873a", metalness: 0.85, roughness: 0.3 });

// left wall: empty frames; a faint "coming soon" so they read as waiting, not broken
function emptyCanvas(label) {
  const c = document.createElement("canvas"); c.width = 512; c.height = 640;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 512, 640);
  grad.addColorStop(0, "#2d2a30"); grad.addColorStop(1, "#1d1b20");
  g.fillStyle = grad; g.fillRect(0, 0, 512, 640);
  g.strokeStyle = "rgba(255,196,107,.25)"; g.setLineDash([10, 10]); g.lineWidth = 3; g.strokeRect(40, 40, 432, 560);
  g.fillStyle = "rgba(243,235,228,.45)"; g.textAlign = "center";
  g.font = "600 30px 'JetBrains Mono', monospace"; g.fillText(label, 256, 320);
  g.font = "22px 'JetBrains Mono', monospace"; g.fillText("coming soon", 256, 360);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
for (const [i, [z, kind]] of [[2, "Painting"], [-2, "Drawing"], [-6, "Painting"]].entries()) {
  const frame = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.9, 1.55), brass);
  const art = new THREE.Mesh(new THREE.PlaneGeometry(1.35, 1.7), new THREE.MeshStandardMaterial({ map: emptyCanvas(kind), roughness: 0.8 }));
  art.rotation.y = Math.PI / 2; art.position.x = 0.045;
  frame.add(art); frame.position.set(-W + 0.05, 2.1, z); frame.castShadow = true; scene.add(frame);
  piece([frame], `${kind} ${i + 1}`, "wall of paintings + drawings", { x: -W + 2.6, z }, { x: -W, y: 2.05, z });
  spot(new THREE.Vector3(-W, 2.1, z), new THREE.Vector3(-W + 2.2, H - 0.1, z), 40, 0.42);
}

// right wall: plinths with slowly spinning stand-in sculptures
const plinthMat = new THREE.MeshStandardMaterial({ color: "#e8e1d4", roughness: 0.7 });
const ghost = new THREE.MeshStandardMaterial({ color: "#ff8a3d", emissive: "#ff6a00", emissiveIntensity: 0.25, metalness: 0.6, roughness: 0.25, wireframe: true });
const spinners = [];
const shapes = [new THREE.TorusKnotGeometry(0.28, 0.09, 90, 10), new THREE.IcosahedronGeometry(0.38, 1), new THREE.TorusGeometry(0.3, 0.1, 12, 40)];
[2, -2, -6].forEach((z, i) => {
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.1, 0.75), plinthMat);
  plinth.position.set(W - 1.3, 0.55, z); plinth.castShadow = plinth.receiveShadow = true;
  const sculpture = new THREE.Mesh(shapes[i], ghost);
  sculpture.position.set(W - 1.3, 1.55, z); sculpture.castShadow = true;
  spinners.push(sculpture); scene.add(plinth, sculpture);
  piece([plinth, sculpture], `Sculpture ${i + 1}`, "coming soon", { x: W - 3.6, z: z + 0.6 }, { x: W - 1.3, y: 1.4, z });
  spot(new THREE.Vector3(W - 1.3, 1.2, z), new THREE.Vector3(W - 2.4, H - 0.1, z + 0.5), 45, 0.32);
});

// back wall: the open book of poetry on a stand
{
  const wood = new THREE.MeshStandardMaterial({ color: "#3b2618", roughness: 0.6 });
  const paper = new THREE.MeshStandardMaterial({ color: "#efe6d2", roughness: 0.9 });
  const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.12, 1.1, 16), wood);
  stand.position.y = 0.55;
  const top = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 0.6), wood);
  top.position.y = 1.12; top.rotation.x = 0.35;
  const book = new THREE.Group();
  for (const side of [-1, 1]) {
    const page = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.04, 0.52), paper);
    page.position.x = side * 0.2; page.rotation.z = -side * 0.12; page.castShadow = true; book.add(page);
  }
  book.position.set(0, 1.17, 0.01); book.rotation.x = 0.35;
  stand.castShadow = top.castShadow = true;
  const g = new THREE.Group(); g.add(stand, top, book); g.position.z = BACK + 1.6; scene.add(g);
  piece([g], "Poetry", "the open book · coming soon", { x: 0, z: BACK + 3.3 }, { x: 0, y: 1.1, z: BACK + 1.6 });
  spot(new THREE.Vector3(0, 1.1, BACK + 1.6), new THREE.Vector3(0, H - 0.1, BACK + 2.6), 50, 0.3);
}

// back corner: the archive chest, warm light leaking from under the lid
{
  const oak = new THREE.MeshStandardMaterial({ color: "#5a3520", roughness: 0.55 });
  const box = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.7, 0.8), oak); box.position.y = 0.35;
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.3, 24, 1, false, 0, Math.PI), oak);
  lid.rotation.z = Math.PI / 2; lid.position.y = 0.74;  // axis along the 1.3 m length, arc on top
  const leak = new THREE.Mesh(new THREE.BoxGeometry(1.26, 0.03, 0.76), new THREE.MeshBasicMaterial({ color: "#ffb347" }));
  leak.position.y = 0.715;
  const warm = new THREE.PointLight("#ff8a3d", 3, 3, 2); warm.position.y = 0.9;
  const g = new THREE.Group(); g.add(box, lid, leak, warm);
  for (const x of [-0.45, 0.45]) {
    const band = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.72, 0.82), brass); band.position.set(x, 0.36, 0); g.add(band);
  }
  box.castShadow = lid.castShadow = true;
  g.position.set(-W + 1.3, 0, BACK + 1.1); g.rotation.y = 0.5; scene.add(g);
  piece([g], "The archive", "high school + college years · coming soon", { x: -W + 3.4, z: BACK + 3.4 }, { x: -W + 1.3, y: 0.5, z: BACK + 1.1 });
  spot(new THREE.Vector3(-W + 1.3, 0.4, BACK + 1.1), new THREE.Vector3(-W + 2.6, H - 0.1, BACK + 2.4), 30, 0.35);
}

// ---------- walking: walk.js turns input into a pose at eye height ----------
const me = walker({ x: 0, z: 5, yaw: 0, pitch: -0.03 });
const el = renderer.domElement;
el.addEventListener("contextmenu", e => e.preventDefault());
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), cap = document.getElementById("caption");
let focused = null;  // the piece whose caption shows; it hides once you walk away from it
function show(p) { focused = p; document.body.classList.toggle("focused", !!p); if (p) { cap.querySelector("b").textContent = p.name; cap.querySelector("span").textContent = p.note; } }
function pick(x, y) {
  ray.setFromCamera(ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  return ray.intersectObjects(pieces, true)[0]?.object;
}
el.addEventListener("pointerdown", e => {
  el.setPointerCapture(e.pointerId);
  me.pointerDown(e.pointerId, e.clientX, e.clientY, e.button === 2 || e.shiftKey, e.isPrimary && e.button === 0);
});
el.addEventListener("pointermove", e => {
  const all = e.getCoalescedEvents?.();  // every sample since the last event; Safari has none
  for (const c of all?.length ? all : [e]) me.pointerMove(e.pointerId, c.clientX, c.clientY);
});
el.addEventListener("pointerup", e => {
  if (!me.pointerUp(e.pointerId, e.clientX, e.clientY)) return;
  let o = pick(e.clientX, e.clientY); while (o && !o.userData.stand) o = o.parent;  // a hit on a child (the canvas, a page)
  if (o) { me.goTo(o.userData.stand, o.userData.look); show(o.userData); }
});
el.addEventListener("pointercancel", e => me.pointerCancel(e.pointerId));
el.addEventListener("wheel", e => { e.preventDefault(); me.wheel(e.deltaY, e.deltaMode, innerHeight); }, { passive: false });
addEventListener("keydown", e => me.keyDown(e));
addEventListener("keyup", e => me.keyUp(e.key));
addEventListener("blur", () => me.blur());

renderer.setAnimationLoop(now => {
  const pose = me.frame(now);
  camera.position.set(pose.x, pose.y, pose.z);
  camera.rotation.set(pose.pitch, pose.yaw, pose.roll);
  if (focused && !pose.flying && Math.hypot(pose.x - focused.stand.x, pose.z - focused.stand.z) > 1.5) show(null);
  for (const s of spinners) s.rotation.y = now * 0.0004;
  renderer.render(scene, camera);
});
</script>
</html>
