  "eriksjaastad": ["other:you're looking at it", "This site. Version one was a 3D room with a checkered floor, sometime in the late '90s. No screenshots survive."],

};

const D = JSON.parse(document.getElementById("graph").textContent);
const TYPE_STYLE = {
  project:  { color: "#ff6a00", word: "project" },
  concept:  { color: "#ffc4ad", word: "tool" },
  artifact: { color: "#6e6872", word: "file or thing" },
  task:     { color: "#9a7a68", word: "task" },
  decision: { color: "#d4906c", word: "decision" },
  lesson:   { color: "#bba57c", word: "lesson" },
};
const FULL_WORD = { artifact: "artifacts", task: "tasks", decision: "decisions", lesson: "lessons", concept: "tools and ideas", project: "projects" };

const N = D.nodes.length;
const pos = new Float32Array(N * 3);
const typeOf = [], deg = [], name = [];
D.nodes.forEach((n, i) => { pos.set([n[0], n[1], n[2]], i * 3); typeOf.push(D.types[n[3]]); deg.push(n[4]); name.push(n[5] || null); });
const nbrs = Array.from({ length: N }, () => []);
for (let k = 0; k < D.edges.length; k += 2) { const a = D.edges[k], b = D.edges[k + 1]; nbrs[a].push(b); nbrs[b].push(a); }
const projIdx = [...Array(N).keys()].filter(i => typeOf[i] === "project").sort((a, b) => name[a].localeCompare(name[b]));

document.getElementById("sub").textContent =
  `${N.toLocaleString()} of ${D.full.nodes.toLocaleString()} memories · real links, names removed`;
document.getElementById("legend").innerHTML = ["project", "concept", "decision", "task", "artifact"].map(t =>
  `<div><i style="background:${TYPE_STYLE[t].color}"></i>${(D.full.byType[t] || 0).toLocaleString().padStart(6, " ")} ${FULL_WORD[t]}</div>`).join("") +
  `<div style="margin-top:4px">full graph: ${D.full.nodes.toLocaleString()} nodes · ${D.full.edges.toLocaleString()} links</div>`;

// ---------- three.js ----------
const stage = document.getElementById("stage");
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }); }
catch (e) { document.body.insertAdjacentHTML("beforeend", `<div id="fail">This needs WebGL, and the browser refused it: ${e.message}</div>`); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x151417, 1);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151417); // a clear color comes out too light through the bloom composer; a scene background is color-managed
scene.fog = new THREE.FogExp2(0x151417, 0.0011);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 5000);
const HOME_CAM = new THREE.Vector3(0, 60, innerWidth < 720 ? 1050 : 820);
camera.position.copy(HOME_CAM);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 4; controls.maxDistance = 1800;
controls.autoRotate = true; controls.autoRotateSpeed = 0.35;
controls.enabled = false;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.4, 0.62);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// Everything but projects: one instanced batch of small orbs, one shader, a different look per kind
// (tool: pale banded giant, decision: copper pearl, task: plasma globe, file: speckled stone).
// One draw call for all of them.
const fillIdx = [...Array(N).keys()].filter(i => typeOf[i] !== "project");
const ORB_KINDS = ["concept", "decision", "task", "artifact"];
const geo = new THREE.SphereGeometry(1, 16, 12);
geo.setAttribute("aKind", new THREE.InstancedBufferAttribute(new Float32Array(fillIdx.map(i => Math.max(0, ORB_KINDS.indexOf(typeOf[i])))), 1));
geo.setAttribute("aSeed", new THREE.InstancedBufferAttribute(new Float32Array(fillIdx.map(() => Math.random() * 50)), 1));
const mat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uFogColor: { value: scene.fog.color }, uFogDensity: { value: scene.fog.density } },
  vertexShader: `attribute float aKind; attribute float aSeed;
    varying vec3 vN; varying vec3 vV; varying vec3 vP; varying float vKind; varying float vSeed; varying float vDepth;
    void main(){ vP = normalize(position); vKind = aKind; vSeed = aSeed;
      vec4 mv = modelViewMatrix * instanceMatrix * vec4(position, 1.);
      vN = normalize(normalMatrix * mat3(instanceMatrix) * normal); vV = normalize(-mv.xyz); vDepth = -mv.z;
      gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform float uTime; uniform vec3 uFogColor; uniform float uFogDensity;
    varying vec3 vN; varying vec3 vV; varying vec3 vP; varying float vKind; varying float vSeed; varying float vDepth;
    float hash(vec3 p){ p = fract(p*0.3183099+.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    float noise(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3.-2.*f);
      return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x), mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x), f.y),
                 mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x), mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x), f.y), f.z); }
    float fbm(vec3 p){ float a = .5, s = 0.; for (int k = 0; k < 4; k++) { s += a*noise(p); p = p*2.03 + vec3(1.7,9.2,3.1); a *= .5; } return s; }
    void main(){
      vec3 N = normalize(vN), V = normalize(vV); // interpolation shortens them; reflect() needs unit length
      vec3 L = normalize(vec3(-.45,.55,.7)), P = vP + vSeed;
      float ndv = max(dot(N,V),0.), diff = max(dot(N,L),0.), spec = max(dot(reflect(-L,N),V),0.);
      vec3 col;
      if (vKind < .5) {          // tool: pale banded giant
        float b = sin(vP.y*16. + fbm(vec3(P.x*2. + uTime*.05, vP.y*6., P.z*2.))*5.);
        col = mix(vec3(.4,.22,.17), vec3(.82,.64,.54), b*.5 + .5) * (.25 + .6*smoothstep(-.15,.6,dot(N,L)));
        col += vec3(1.,.72,.6)*pow(1.-ndv,2.6)*.3;
      } else if (vKind < 1.5) {  // decision: copper pearl
        float fr = pow(1.-ndv,2.);
        vec3 irid = mix(vec3(1.,.55,.3), .5 + .5*cos(6.2831*(fr*1.2 + uTime*.05 + vec3(0.,.12,.25))), .35);
        col = mix(vec3(.62,.32,.18), vec3(.93,.62,.42), vP.y*.5 + .5)*(.3 + .6*diff) + irid*fr*.7 + pow(spec,48.);
      } else if (vKind < 2.5) {  // task: small plasma globe
        float fil = pow(1. - abs(fbm(P*3. + vec3(0., uTime*.25, uTime*.1))*2. - 1.), 10.);
        col = vec3(.09,.05,.04) + vec3(.85,.5,.3)*fil + vec3(.6,.42,.33)*pow(1.-ndv,2.5)*.7 + pow(spec,60.)*.5;
      } else {                   // file or thing: speckled stone
        col = mix(vec3(.17,.16,.19), vec3(.32,.3,.34), noise(P*14.))*(.3 + .6*diff) + vec3(.6,.55,.6)*pow(1.-ndv,3.)*.22;
      }
      float fog = 1. - exp(-uFogDensity*uFogDensity*vDepth*vDepth);
      gl_FragColor = vec4(mix(col, uFogColor, fog), 1.);
    }`,
});
const inst = new THREE.InstancedMesh(geo, mat, fillIdx.length);
const scaleOf = i => typeOf[i] === "concept" ? 3.2 + Math.log2(1 + deg[i]) * 0.5 : 0.9 + Math.log2(1 + deg[i]) * 0.35;
const tmpM = new THREE.Matrix4(), tmpV = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3();
scene.add(inst);
const instOf = new Map(fillIdx.map((i, k) => [i, k]));

// projects: Capsella-style bubbles: clear shell, glowing core, a slow gear inside
const shellMat = new THREE.ShaderMaterial({
  uniforms: { uColor: { value: new THREE.Color(0xffb48a) }, uAlpha: { value: 0.75 } },
  vertexShader: `varying vec3 vN; varying vec3 vV;
    void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform vec3 uColor; uniform float uAlpha; varying vec3 vN; varying vec3 vV;
    void main(){ float f = pow(1.-abs(dot(vN,vV)), 2.6); gl_FragColor = vec4(uColor, f*uAlpha*.8 + .02); }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const projGroups = new Map();
const hitTargets = [];
projIdx.forEach(i => {
  const g = new THREE.Group();
  const r = 9 + Math.log2(1 + deg[i]) * 1.4;
  const shell = new THREE.Mesh(new THREE.SphereGeometry(r, 40, 24), shellMat.clone());
  const core = new THREE.Mesh(new THREE.SphereGeometry(r * 0.26, 20, 12), new THREE.MeshBasicMaterial({ color: 0xff6a00 }));
  const gear = new THREE.Mesh(new THREE.TorusGeometry(r * 0.55, r * 0.07, 6, 14), new THREE.MeshBasicMaterial({ color: 0xff8a3d, transparent: true, opacity: 0.85 }));
  gear.rotation.x = Math.random() * Math.PI; gear.userData.spin = 0.2 + Math.random() * 0.3;
  const hit = new THREE.Mesh(new THREE.SphereGeometry(r * 1.1, 10, 8), new THREE.MeshBasicMaterial({ visible: false }));
  hit.userData.node = i;
  g.add(shell, core, gear, hit);
  g.userData = { shell, core, gear, r };
  scene.add(g); projGroups.set(i, g); hitTargets.push(hit);
});

// links
const linePos = new Float32Array(D.edges.length * 3);
const lineCol = new Float32Array(D.edges.length * 3);
const ca = new THREE.Color(), cb = new THREE.Color();
for (let k = 0; k < D.edges.length; k += 2) {
  const a = D.edges[k], b = D.edges[k + 1];
  ca.set(TYPE_STYLE[typeOf[a]].color); cb.set(TYPE_STYLE[typeOf[b]].color);
  lineCol.set([ca.r, ca.g, ca.b], k * 3); lineCol.set([cb.r, cb.g, cb.b], k * 3 + 3);
}
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute("position", new THREE.BufferAttribute(linePos, 3));
lineGeo.setAttribute("color", new THREE.BufferAttribute(lineCol, 3));
const lineMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0, depthWrite: false });
scene.add(new THREE.LineSegments(lineGeo, lineMat));
const LINE_OPACITY = 0.09;

const hiGeo = new THREE.BufferGeometry();
const hiMat = new THREE.LineBasicMaterial({ color: 0xff6a00, transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending });
const hiLines = new THREE.LineSegments(hiGeo, hiMat);
scene.add(hiLines);

// dust: the "alive" motes drifting in the room
const dustN = 700, dustPos = new Float32Array(dustN * 3);
for (let k = 0; k < dustN; k++) { const r = 200 + Math.random() * 900, t = Math.random() * 6.283, p = Math.acos(2 * Math.random() - 1);
  dustPos.set([r * Math.sin(p) * Math.cos(t), r * Math.cos(p), r * Math.sin(p) * Math.sin(t)], k * 3); }
const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xff8a4a, size: 1.6, transparent: true, opacity: 0.35, depthWrite: false }));
scene.add(dust);

// ---------- animated positions (entrance) ----------
const cur = new Float32Array(pos);      // what's drawn
const start = new Float32Array(N * 3);
const delay = new Float32Array(N);
function seedStart() {
  // everything starts behind the camera and streams past it into place
  for (let i = 0; i < N; i++) {
    start[i * 3] = pos[i * 3] * 0.15 + (Math.random() - .5) * 160;
    start[i * 3 + 1] = pos[i * 3 + 1] * 0.15 + (Math.random() - .5) * 120 + 60;
    start[i * 3 + 2] = HOME_CAM.z + 250 + Math.random() * 900;
    delay[i] = typeOf[i] === "project" ? 0.25 + Math.random() * 0.25 : Math.random() * 0.55;
  }
}
const ease = t => 1 - Math.pow(1 - t, 3);
let entrance = null; // {t0}
const ENTER_DUR = 2.6;

function writePositions() {
  fillIdx.forEach((i, k) => {
    const s = scaleOf(i);
    tmpV.set(cur[i * 3], cur[i * 3 + 1], cur[i * 3 + 2]); tmpS.set(s, s, s);
    tmpM.compose(tmpV, tmpQ, tmpS); inst.setMatrixAt(k, tmpM);
  });
  inst.instanceMatrix.needsUpdate = true;
  inst.computeBoundingSphere();
  projGroups.forEach((g, i) => g.position.set(cur[i * 3], cur[i * 3 + 1], cur[i * 3 + 2]));
  for (let k = 0; k < D.edges.length; k++) { const n = D.edges[k]; linePos[k * 3] = cur[n * 3]; linePos[k * 3 + 1] = cur[n * 3 + 1]; linePos[k * 3 + 2] = cur[n * 3 + 2]; }
  lineGeo.attributes.position.needsUpdate = true;
  lineGeo.computeBoundingSphere();
}

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function startEntrance() {
  closeCard(true);
  camera.position.copy(HOME_CAM); controls.target.set(0, 0, 0);
  if (reduced) { cur.set(pos); writePositions(); lineMat.opacity = LINE_OPACITY; finishEntrance(); return; }
  seedStart(); cur.set(start); writePositions(); lineMat.opacity = 0;
  entrance = { t0: performance.now() / 1000 };
}
function finishEntrance() {
  entrance = null; controls.enabled = true; document.body.classList.add("ready");
}
function resetEntrance() {
  document.body.classList.remove("ready"); controls.enabled = false; entrance = null; flight = null;
  closeCard(true);
  seedStart(); cur.set(start); writePositions(); lineMat.opacity = 0;
}

// ---------- labels ----------
const labelsEl = document.getElementById("labels");
const labelEls = new Map();
projIdx.forEach(i => { const el = document.createElement("div"); el.className = "lbl"; el.textContent = name[i]; labelsEl.appendChild(el); labelEls.set(i, el); });
const proj = new THREE.Vector3();
function placeLabels() {
  const ready = document.body.classList.contains("ready");
  labelEls.forEach((el, i) => {
    const g = projGroups.get(i);
    proj.copy(g.position); const dist = proj.distanceTo(camera.position); proj.project(camera);
    if (!ready || proj.z > 1) { el.style.opacity = 0; return; }
    const x = (proj.x * .5 + .5) * innerWidth, y = (-proj.y * .5 + .5) * innerHeight + g.userData.r * 900 / dist + 10;
    const a = i === hoverNode || i === selected ? 1 : Math.max(0, Math.min(.85, 1.6 - dist / 700));
    el.style.opacity = a; el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
    el.classList.toggle("hot", i === hoverNode || i === selected);
  });
}

// ---------- hover / click ----------
const ray = new THREE.Raycaster(); ray.params.Line.threshold = 0;
const mouse = new THREE.Vector2();
const tip = document.getElementById("tip");
let hoverNode = null, selected = null, pointer = null, downAt = null;

function toolsOf(i) { return nbrs[i].filter(j => typeOf[j] === "concept").map(j => name[j]); }
function projectsOf(i) { return nbrs[i].filter(j => typeOf[j] === "project").map(j => name[j]); }

function pick(ev) {
  mouse.set(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hp = ray.intersectObjects(hitTargets, false)[0];
  const hi = ray.intersectObject(inst, false)[0];
  if (hp && (!hi || hp.distance <= hi.distance + 6)) return hp.object.userData.node;
  if (hi) return fillIdx[hi.instanceId];
  return null;
}
function showTip(i, ev) {
  if (i == null) { tip.classList.remove("on"); return; }
  const t = typeOf[i];
  let html;
  if (t === "project") html = `<b>${name[i]}</b>${PROJECTS[name[i]]?.[1].split(". ")[0] ?? ""}.<div class="k">click to fly in</div>`;
  else if (t === "concept") { const ps = projectsOf(i); html = `<b>${name[i]}</b><span class="k">tool · ${nbrs[i].length} links here${ps.length ? " · used in " + ps.slice(0, 4).join(", ") : ""}</span>`; }
  else html = `<span class="k">one ${TYPE_STYLE[t].word} · ${nbrs[i].length} links<br>${(D.full.byType[t] || 0).toLocaleString()} ${FULL_WORD[t]} in the full memory</span>`;
  tip.innerHTML = html; tip.classList.add("on");
  const x = Math.min(ev.clientX + 14, innerWidth - 270), y = Math.min(ev.clientY + 14, innerHeight - 90);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function setHighlight(i) {
  if (i == null) { hiGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(0), 3)); return; }
  const arr = new Float32Array(nbrs[i].length * 6);
  nbrs[i].forEach((j, k) => arr.set([cur[i * 3], cur[i * 3 + 1], cur[i * 3 + 2], cur[j * 3], cur[j * 3 + 1], cur[j * 3 + 2]], k * 6));
  hiGeo.setAttribute("position", new THREE.BufferAttribute(arr, 3)); hiGeo.computeBoundingSphere();
}
const canvas = renderer.domElement;
canvas.addEventListener("pointermove", ev => { pointer = ev; });
const downIds = new Set();
let multi = false;
canvas.addEventListener("pointerdown", ev => {
  if (!downIds.size) multi = false;
  downIds.add(ev.pointerId); multi = multi || downIds.size > 1;
  downAt = [ev.clientX, ev.clientY]; stopAuto();
});
for (const t of ["pointerup", "pointercancel"]) canvas.addEventListener(t, ev => { downIds.delete(ev.pointerId); });
canvas.addEventListener("pointerup", ev => {
  if (multi) { downAt = null; if (!downIds.size) multi = false; return; }
  if (!downAt || !controls.enabled) return;
  const moved = Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]); downAt = null;
  if (moved > 5 || ev.button !== 0) return;
  const i = pick(ev);
  if (i == null) { if (selected != null) closeCard(); return; }
  if (typeOf[i] === "project") openCard(i);
  else flyTo(i, 40);
});
canvas.addEventListener("pointerleave", () => { pointer = null; tip.classList.remove("on"); });
canvas.addEventListener("wheel", stopAuto, { passive: true });

// ---------- camera flights ----------
let flight = null;
function flyTo(i, back = 70) {
  const p = new THREE.Vector3(cur[i * 3], cur[i * 3 + 1], cur[i * 3 + 2]);
  const out = p.clone().normalize(); if (!isFinite(out.x)) out.set(0, 0, 1);
  const r = projGroups.get(i)?.userData.r ?? 2;
  const to = p.clone().add(out.multiplyScalar(back + r * 2.5)).add(new THREE.Vector3(0, r * 1.2, 0));
  flyCam(to, p);
}
function flyCam(toPos, toTarget, dur = 1.5) {
  flight = { t0: performance.now() / 1000, dur, fromP: camera.position.clone(), fromT: controls.target.clone(), toP: toPos, toT: toTarget };
  stopAuto();
}

// ---------- card ----------
const card = document.getElementById("card");
function openCard(i) {
  selected = i;
  const [st, blurb] = PROJECTS[name[i]] || ["bench", ""];
  const s = document.getElementById("cStatus");
  if (st.startsWith("other:")) { s.className = "status other"; s.textContent = st.slice(6); }
  else { s.className = "status " + st; s.textContent = st === "daily" ? "daily driver" : "on the workbench"; }
  document.getElementById("cName").textContent = name[i];
  document.getElementById("cBlurb").textContent = blurb;
  const tools = toolsOf(i);
  document.getElementById("cTools").innerHTML = tools.length ? tools.map(t => `<span class="chip">${t}</span>`).join("") : `<span class="chip">no tool links in this slice</span>`;
  const by = {}; nbrs[i].forEach(j => { if (typeOf[j] !== "concept") by[typeOf[j]] = (by[typeOf[j]] || 0) + 1; });
  document.getElementById("cCounts").innerHTML = Object.entries(by).sort((a, b) => b[1] - a[1])
    .map(([t, c]) => `${String(c).padStart(4, " ")} ${c === 1 ? TYPE_STYLE[t].word : FULL_WORD[t]}`).join("<br>") || "none";
  card.classList.add("on"); card.inert = false;
  document.querySelectorAll("#list button").forEach(b => b.classList.toggle("on", +b.dataset.i === i));
  setHighlight(i); flyTo(i);
}
function closeCard(silent) {
  if (selected == null && !silent) return;
  selected = null; card.classList.remove("on"); card.inert = true; setHighlight(hoverNode);
  document.querySelectorAll("#list button").forEach(b => b.classList.remove("on"));
  if (!silent) flyCam(HOME_CAM.clone(), new THREE.Vector3());
}
function step(d) { const k = projIdx.indexOf(selected); openCard(projIdx[(k + d + projIdx.length) % projIdx.length]); }
document.getElementById("cClose").onclick = () => closeCard();
document.getElementById("cPrev").onclick = () => step(-1);
document.getElementById("cNext").onclick = () => step(1);
document.getElementById("overview").onclick = () => { closeCard(true); flyCam(HOME_CAM.clone(), new THREE.Vector3()); };
document.getElementById("replay").onclick = () => { resetEntrance(); startEntrance(); };
const list = document.getElementById("list");
list.innerHTML = projIdx.map(i => `<button type="button" data-i="${i}">${name[i]}</button>`).join("");
list.addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) { openCard(+b.dataset.i); if (innerWidth < 720) list.hidden = true; } });
list.addEventListener("mouseover", ev => { const b = ev.target.closest("button"); hoverNode = b ? +b.dataset.i : null; setHighlight(selected ?? hoverNode); });
list.addEventListener("mouseleave", () => { hoverNode = null; setHighlight(selected); });
document.getElementById("toggleList").onclick = () => { list.hidden = !list.hidden; };
if (innerWidth >= 720) list.hidden = false;
// Phones: the list floats just under the button bar, which wraps to as many rows as the width needs,
// and stops above the hint line at the bottom.
const topbar = document.getElementById("topbar"), phone = matchMedia("(max-width: 720px)");
function placeList() {
  if (!phone.matches) { list.style.top = list.style.maxHeight = ""; return; }
  const top = topbar.getBoundingClientRect().bottom + 8;
  list.style.top = top + "px";
  list.style.maxHeight = Math.max(0, innerHeight - top - 48) + "px";
}
placeList();
document.fonts.ready.then(placeList);
addEventListener("keydown", ev => {
  if (ev.key === "Escape") closeCard();
  if (selected != null && ev.key === "ArrowRight") step(1);
  if (selected != null && ev.key === "ArrowLeft") step(-1);
});

// idle auto-rotate comes back after a while
let idleTimer = null;
function stopAuto() { controls.autoRotate = false; clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (selected == null) controls.autoRotate = true; }, 9000); }

// Embedded behind the homepage: stay dark until it says "enter", and hand "Home" back to it
// so the homepage can return without a page load. Opened directly, fly in at once.
const embedded = parent !== window;
let live = !embedded;
if (embedded) {
  addEventListener("message", ev => {
    if (ev.origin !== location.origin) return;
    if (ev.data === "enter") { live = true; resetEntrance(); startEntrance(); }
    if (ev.data === "reset") { live = false; resetEntrance(); }
  });
  document.getElementById("homeLink").onclick = ev => {
    if (ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return; // new tab still works
    ev.preventDefault(); parent.postMessage("home", location.origin);
  };
}

// ---------- loop ----------
addEventListener("resize", () => {
  placeList();
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
let last = performance.now() / 1000;
function frame() {
  if (!live) { requestAnimationFrame(frame); return; }
  const now = performance.now() / 1000, dt = Math.min(0.05, now - last); last = now;
  if (entrance) {
    const t = now - entrance.t0;
    let done = true;
    for (let i = 0; i < N; i++) {
      const u = Math.max(0, Math.min(1, (t - delay[i]) / (ENTER_DUR - 0.55)));
      if (u < 1) done = false;
      const e = ease(u);
      for (let a = 0; a < 3; a++) cur[i * 3 + a] = start[i * 3 + a] + (pos[i * 3 + a] - start[i * 3 + a]) * e;
    }
    writePositions();
    lineMat.opacity = LINE_OPACITY * Math.max(0, Math.min(1, (t - ENTER_DUR * 0.7) / 0.8));
    if (done) { lineMat.opacity = LINE_OPACITY; finishEntrance(); }
  }
  if (flight) {
    const u = Math.min(1, (now - flight.t0) / flight.dur), e = u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    camera.position.lerpVectors(flight.fromP, flight.toP, e);
    controls.target.lerpVectors(flight.fromT, flight.toT, e);
    if (u >= 1) flight = null;
  }
  if (pointer && controls.enabled && !flight) {
    const i = pick(pointer);
    if (i !== hoverNode) { hoverNode = i; setHighlight(selected ?? hoverNode); canvas.style.cursor = i == null ? "grab" : "pointer"; }
    showTip(i, pointer);
  }
  projGroups.forEach((g, i) => {
    g.userData.gear.rotation.y += dt * g.userData.gear.userData.spin;
    g.userData.gear.rotation.z += dt * 0.1;
    const hot = i === hoverNode || i === selected;
    const s = THREE.MathUtils.lerp(g.scale.x, hot ? 1.25 : 1, 0.15); g.scale.setScalar(s);
    g.userData.shell.material.uniforms.uAlpha.value = hot ? 1.2 : 0.75;
  });
  if (!reduced) mat.uniforms.uTime.value = now;
  dust.rotation.y += dt * 0.01; dust.rotation.x += dt * 0.004;
  controls.update();
  composer.render();
  placeLabels();
  requestAnimationFrame(frame);
}
seedStart(); cur.set(start); writePositions();
if (live) startEntrance();
requestAnimationFrame(frame);
</script>
