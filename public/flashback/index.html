<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashback · Erik Sjaastad</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* One '90s cabin you walk round like /gallery/. Chrome floats in the corners. */
:root {
  --bg: #120f0d; --ink: #f3ebe4; --muted: #a39484; --neon: #ff6a00; --line: #3b322b;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--display); overflow: hidden; }
#stage { position: fixed; inset: 0; } #stage canvas { display: block; touch-action: none; }
.chrome { position: fixed; z-index: 2; }
#title { top: max(16px, env(safe-area-inset-top)); left: 18px; pointer-events: none; }
#title h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; } #title p { margin: 2px 0 0; font: 12px var(--mono); color: var(--muted); }
#home { top: max(14px, env(safe-area-inset-top)); right: 16px; font-size: 14px; color: var(--ink); text-decoration: none; background: rgba(18,15,13,.6); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; }
#home:hover { border-color: var(--neon); color: var(--neon); }
#hint { left: 18px; bottom: max(16px, env(safe-area-inset-bottom)); font: 12px var(--mono); color: var(--muted); pointer-events: none; transition: opacity .4s; }
#caption { left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translate(-50%, 12px); opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; text-align: center; width: min(92vw, 520px); }
#caption b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -.02em; } #caption span { font: 13px var(--mono); color: #ffc46b; }
body.focused #caption { opacity: 1; transform: translate(-50%, 0); } body.focused #hint { opacity: 0; }  /* both sit at the bottom */
#hint .touch { display: none; } @media (hover: none) { #hint .desk { display: none; } #hint .touch { display: inline; } }
/* reading an album: the book fills the screen over the room; a photo opens over the book */
/* both are modal <dialog>s: the browser keeps focus inside the top one, makes the rest inert and closes it on Escape */
dialog { border: 0; padding: 12px; box-sizing: border-box; width: 100vw; height: 100dvh; max-width: none; max-height: none; background: transparent; color: var(--ink); place-items: center;
  grid-template: minmax(0, 1fr) / minmax(0, 1fr); }  /* one cell the size of the screen, so children can use 100% */
dialog[open] { display: grid; }
dialog::backdrop { background: rgba(12,9,7,.84); backdrop-filter: blur(4px); }
/* the book never outgrows the screen: its pages scroll between the title and the buttons */
#book .wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(94vw, 1040px); max-height: 100%; }
#book header { display: flex; justify-content: space-between; align-items: baseline; width: 100%; }
#book h2 { margin: 0; font-size: 22px; font-weight: 800; } #book .count { font: 12px var(--mono); color: var(--muted); }
.spread { display: flex; width: 100%; flex: 0 1 auto; min-height: 0; overflow: auto; background: #efe6d2; border-radius: 6px; box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: turn .35s ease-out; }
.scrap .spread { background: #fbd7e5; }
@keyframes turn { from { opacity: 0; transform: translateX(var(--from, 0)); } }
.page { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 26px; align-content: start; }
.page + .page { border-left: 2px solid rgba(0,0,0,.12); }
.page button { all: unset; cursor: zoom-in; background: #fff; padding: 6px 6px 20px; box-shadow: 0 4px 12px rgba(0,0,0,.25); transform: rotate(var(--tilt)); }
.page button:focus-visible { outline: 2px solid var(--neon); }
.page img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.scrap .page button:nth-child(2n) { border-radius: 50% 50% 8px 8px; } /* scrapbook cut-outs */
#book nav { display: flex; gap: 10px; }
#book nav button, #book .close, #photo .close { font: 14px var(--display); color: var(--ink); background: rgba(18,15,13,.7); border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer; }
#book nav button:disabled { opacity: .35; cursor: default; }
#book nav button:hover:not(:disabled), #book .close:hover, #photo .close:hover { border-color: var(--neon); color: var(--neon); }
#photo figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
/* fits by width and height, so landscape and portrait prints are whole on any screen */
#photo img { display: block; max-width: calc(100vw - 48px); max-height: calc(100dvh - 130px); width: auto; height: auto; background: #fff; padding: 10px 10px 30px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
#photo figcaption { font: 13px var(--mono); color: #ffc46b; }
@media (max-width: 700px) { .page { padding: 16px; gap: 10px; } }
</style>
<div id="stage"></div>
<header id="title" class="chrome"><h1>Flashback</h1><p>a cabin full of the '90s · still moving in</p></header>
<a id="home" class="chrome" href="/">Home</a>
<div id="hint" class="chrome"><span class="desk">drag to look · scroll or WASD to walk · right-drag to slide · Q/E to turn · click something to walk to it</span><span class="touch">drag to look · pinch to walk · tap something</span></div>
<div id="caption" class="chrome" aria-live="polite"><b></b><span></span></div>
<dialog id="book" aria-labelledby="bookTitle">
  <div class="wrap">
    <header><h2 id="bookTitle"></h2><span class="count"></span><button class="close">Close</button></header>
    <div class="spread"></div>
    <nav><button class="prev">‹ Back</button><button class="next">Turn ›</button></nav>
  </div>
</dialog>
<dialog id="photo" aria-label="Photo"><figure><img alt=""><figcaption></figcaption><button class="close">Back to the album</button></figure></dialog>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";
import { walker } from "../gallery/walk.js";
import { walkThrough } from "../gallery/room.js";
import { CABIN, START, SPOTS, OPENABLE, hinges } from "./cabin.js";
import { BOOKS, pager } from "./albums.js";

// Room: x -4..4, floor y 0, ceiling y 3, front door z +4, back wall z -4 (cabin.js has the floor plan).
const W = 4, H = 3, FRONT = 4, BACK = -4;

let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (err) { document.querySelector("#title p").textContent = "this room needs WebGL, which this browser could not start"; throw err; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById("stage").appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#120f0d");
scene.add(new THREE.HemisphereLight("#ffe0bd", "#2a1a10", 0.9));

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 40);
camera.rotation.order = "YXZ";  // turn, then tilt the head: no roll
// portrait phones: widen the vertical FOV so both side walls stay in view
function fit() {
  camera.aspect = innerWidth / innerHeight;
  const half = Math.atan(Math.tan(THREE.MathUtils.degToRad(42)) / camera.aspect);
  camera.fov = THREE.MathUtils.clamp(2 * THREE.MathUtils.radToDeg(half), 60, 100);
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
fit();
addEventListener("resize", fit);

// boards: horizontal logs on the walls, planks on the floor, drawn once on a canvas and repeated
function boards(base, seam, n, repeatX, repeatY) {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d");
  for (let i = 0; i < n; i++) {
    g.fillStyle = `hsl(${base[0] + (i * 37 % 7)}, ${base[1]}%, ${base[2] + (i * 53 % 9) - 4}%)`;
    g.fillRect(0, i * 256 / n, 256, 256 / n);
    g.fillStyle = seam; g.fillRect(0, (i + 1) * 256 / n - 3, 256, 3);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeatX, repeatY); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(2 * W, FRONT - BACK),
  new THREE.MeshStandardMaterial({ map: boards([28, 45, 30], "#1c120b", 8, 1, 3), roughness: 0.6 }));
floor.rotation.x = -Math.PI / 2; floor.rotation.z = Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const logs = new THREE.MeshStandardMaterial({ map: boards([24, 40, 34], "#24170e", 6, 2, 2), roughness: 0.85 });
function wall(w, h, x, y, z, ry) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), logs);
  m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; scene.add(m);
}
for (const side of [-1, 1]) wall(FRONT - BACK, H, side * W, H / 2, 0, -side * Math.PI / 2);
wall(2 * W, H, 0, H / 2, BACK, 0);
wall(2 * W, H, 0, H / 2, FRONT, Math.PI);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(2 * W, FRONT - BACK), new THREE.MeshStandardMaterial({ color: "#1d140e" }));
ceil.rotation.x = Math.PI / 2; ceil.position.y = H; scene.add(ceil);
for (const z of [-2.5, 0, 2.5]) {  // ceiling beams
  const beam = new THREE.Mesh(new THREE.BoxGeometry(2 * W, 0.22, 0.22), new THREE.MeshStandardMaterial({ color: "#3a2516", roughness: 0.8 }));
  beam.position.set(0, H - 0.11, z); scene.add(beam);
}

// left wall: a window onto a moonlit forest, which is most of the magic
{
  const c = document.createElement("canvas"); c.width = 256; c.height = 192;
  const g = c.getContext("2d");
  const sky = g.createLinearGradient(0, 0, 0, 192); sky.addColorStop(0, "#0d1a33"); sky.addColorStop(1, "#24406b");
  g.fillStyle = sky; g.fillRect(0, 0, 256, 192);
  g.fillStyle = "#f4f0dc"; g.beginPath(); g.arc(190, 46, 16, 0, 7); g.fill();
  g.fillStyle = "#08110f";
  for (let i = 0; i < 9; i++) { const x = i * 32 - 8, h = 70 + (i * 41 % 50); g.beginPath(); g.moveTo(x, 192); g.lineTo(x + 20, 192 - h); g.lineTo(x + 40, 192); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const pane = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.2), new THREE.MeshBasicMaterial({ map: t }));
  pane.rotation.y = Math.PI / 2; pane.position.set(-W + 0.01, 1.7, 0.5); scene.add(pane);
  const sash = new THREE.MeshStandardMaterial({ color: "#e9e0cf", roughness: 0.7 });
  for (const [w, h, y, z] of [[0.08, 1.36, 1.7, -0.32], [0.08, 1.36, 1.7, 1.32], [0.08, 1.36, 1.7, 0.5], [1.72, 0.08, 2.34, 0.5], [1.72, 0.08, 1.06, 0.5], [1.72, 0.06, 1.7, 0.5]]) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.06, h, w), sash); bar.position.set(-W + 0.03, y, z); scene.add(bar);
  }
  const moon = new THREE.SpotLight("#9fb8ff", 18, 9, 0.6, 0.8, 1.5);
  moon.position.set(-W + 0.1, 2.2, 0.5); moon.target.position.set(0, 0, 0.8); scene.add(moon, moon.target);
}

// front wall: the door you came in by
{
  const door = new THREE.Mesh(new THREE.BoxGeometry(1, 2.1, 0.06), new THREE.MeshStandardMaterial({ color: "#4a2d1a", roughness: 0.7 }));
  door.position.set(0, 1.05, FRONT - 0.03); scene.add(door);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 8), new THREE.MeshStandardMaterial({ color: "#c9a24a", metalness: 0.9, roughness: 0.3 }));
  knob.position.set(0.38, 1.0, FRONT - 0.08); scene.add(knob);
}

// the rug, and a warm lamp hanging over the middle of the room
{
  const rug = new THREE.Mesh(new THREE.CircleGeometry(1.5, 48), new THREE.MeshStandardMaterial({ color: "#7a2f22", roughness: 1 }));
  rug.rotation.x = -Math.PI / 2; rug.position.set(0, 0.005, 0.2); rug.receiveShadow = true; scene.add(rug);
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.2, 1.3, 48), new THREE.MeshStandardMaterial({ color: "#d9a441", roughness: 1 }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(0, 0.006, 0.2); scene.add(ring);
  const lamp = new THREE.PointLight("#ffbf73", 9, 9, 1.6);
  lamp.position.set(0, H - 0.6, 0); lamp.castShadow = true; lamp.shadow.mapSize.set(1024, 1024); lamp.shadow.bias = -0.002; scene.add(lamp);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), new THREE.MeshBasicMaterial({ color: "#ffe2b0" }));
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.25, 24, 1, true), new THREE.MeshStandardMaterial({ color: "#d9a441", side: THREE.DoubleSide, roughness: 0.6 }));
  const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.5), new THREE.MeshBasicMaterial({ color: "#111" }));
  bulb.position.copy(lamp.position); shade.position.set(0, H - 0.5, 0); cord.position.set(0, H - 0.25, 0); scene.add(bulb, shade, cord);
}

// a thing you can click: where to stand, what to look at, and its caption
const pieces = [];
// a mesh placed at x, y, z with an optional rotation, ready to add to a group
const mesh = (geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.set(rx, ry, rz); return m; };
function piece(objs, name, note, { stand, look }) { for (const o of objs) { o.userData = { name, note, stand, look }; pieces.push(o); } }

// back wall: the chest of drawers. Three drawers at waist height, a countertop, two cabinet doors above,
// and a shelf of photo albums on top. Standing at it, tap a drawer or a door to open or shut it.
const parts = {};  // OPENABLE name -> the drawer or door hinge group that moves
{
  const oak = new THREE.MeshStandardMaterial({ color: "#6b4226", roughness: 0.55 });
  const face = new THREE.MeshStandardMaterial({ color: "#7d4f2e", roughness: 0.5 });
  const brass = new THREE.MeshStandardMaterial({ color: "#c9a24a", metalness: 0.9, roughness: 0.3 });
  const g = new THREE.Group();
  const add = (geo, mat, x, y, z) => { const m = mesh(geo, mat, x, y, z); m.castShadow = m.receiveShadow = true; g.add(m); return m; };
  add(new THREE.BoxGeometry(1.4, 0.95, 0.55), oak, 0, 0.475, 0);              // lower carcass
  const felt = new THREE.MeshStandardMaterial({ color: "#2b1d2e", roughness: 1 });
  for (const [i, y] of [0.17, 0.47, 0.77].entries()) {                        // the three drawers: a front and a tray
    const d = new THREE.Group(); d.position.set(0, y, 0.285); d.name = `drawer${i}`; g.add(d); parts[d.name] = d;
    d.add(mesh(new THREE.BoxGeometry(1.3, 0.26, 0.04), face, 0, 0, 0));
    for (const x of [-0.35, 0.35]) d.add(mesh(new THREE.SphereGeometry(0.025, 12, 8), brass, x, 0, 0.03));
    d.add(mesh(new THREE.BoxGeometry(1.2, 0.02, 0.44), felt, 0, -0.1, -0.24));  // the tray's floor, inside the chest when shut
    for (const x of [-0.6, 0.6]) d.add(mesh(new THREE.BoxGeometry(0.02, 0.18, 0.44), oak, x, -0.02, -0.24));
    d.add(mesh(new THREE.BoxGeometry(1.2, 0.18, 0.02), oak, 0, -0.02, -0.46));
  }
  add(new THREE.BoxGeometry(1.5, 0.05, 0.62), face, 0, 0.975, 0.02);          // the countertop
  add(new THREE.BoxGeometry(1.3, 0.8, 0.38), oak, 0, 1.55, -0.08);            // upper cabinet, set back
  add(new THREE.PlaneGeometry(1.24, 0.74), felt, 0, 1.55, 0.112);             // the dark inside, seen with the doors open
  add(new THREE.BoxGeometry(1.24, 0.02, 0.02), oak, 0, 1.55, 0.115);           // and its shelf
  for (const side of [-1, 1]) {                                                // its two doors, hinged at the outer edges
    const hinge = new THREE.Group(); hinge.position.set(side * 0.63, 1.55, 0.125); hinge.name = side < 0 ? "doorLeft" : "doorRight";
    g.add(hinge); parts[hinge.name] = hinge;
    const d = mesh(new THREE.BoxGeometry(0.62, 0.72, 0.03), face, -side * 0.31, 0, 0); d.castShadow = true; hinge.add(d);
    d.add(mesh(new THREE.SphereGeometry(0.022, 12, 8), brass, -side * 0.25, 0, 0.025));
  }
  add(new THREE.BoxGeometry(1.4, 0.04, 0.4), face, 0, 1.97, -0.08);           // shelf on top
  // albums standing on the shelf, and the scrapbook lying flat with stickers on it
  const covers = ["#1f4e79", "#8c2f39", "#2f6b4f", "#5b3f8c", "#c47f2c"];
  covers.forEach((c, i) => {
    const a = add(new THREE.BoxGeometry(0.07, 0.34, 0.27), new THREE.MeshStandardMaterial({ color: c, roughness: 0.6 }), -0.6 + i * 0.09, 2.16, -0.08);
    a.rotation.z = i === covers.length - 1 ? -0.18 : 0; a.name = `album${i}`;
  });
  const scrap = add(new THREE.BoxGeometry(0.38, 0.06, 0.3), new THREE.MeshStandardMaterial({ color: "#f2a7c3", roughness: 0.8 }), 0.35, 2.02, -0.08);
  scrap.name = "scrapbook";
  for (const [x, z, c] of [[-0.1, -0.05, "#ffe14d"], [0.08, 0.07, "#4dd9ff"], [0.12, -0.08, "#9b5cff"]]) {
    scrap.add(mesh(new THREE.CircleGeometry(0.035, 5), new THREE.MeshBasicMaterial({ color: c }), x, 0.031, z, -Math.PI / 2, 0, x * 9));
  }
  g.position.set(0, 0, BACK + 0.3); scene.add(g);
  piece([g], "The chest of drawers", "tap an album, the scrapbook, a drawer or a door", SPOTS.chest);
  const s = new THREE.SpotLight("#ffd9a8", 14, 6, 0.5, 0.6, 1.4);
  s.position.set(0, H - 0.1, BACK + 2); s.target.position.set(0, 1.2, BACK + 0.3); s.castShadow = true; s.shadow.mapSize.set(512, 512);
  scene.add(s, s.target);
}

// back right corner: a '90s snowboard leaning on the wall and a pair of rollerblades on the floor
{
  // the board: a real outline (wide nose and tail, a waisted sidecut), thin, with a '90s top sheet and two bindings,
  // standing on its tail with the top sheet facing the room
  const L = 1.55, tip = 0.13, waist = 0.112;
  const outline = new THREE.Shape();
  outline.moveTo(-tip, -L / 2 + 0.15);
  outline.quadraticCurveTo(-waist, 0, -tip, L / 2 - 0.15);
  outline.bezierCurveTo(-tip - 0.005, L / 2 + 0.02, tip + 0.005, L / 2 + 0.02, tip, L / 2 - 0.15);
  outline.quadraticCurveTo(waist, 0, tip, -L / 2 + 0.15);
  outline.bezierCurveTo(tip + 0.005, -L / 2 - 0.02, -tip - 0.005, -L / 2 - 0.02, -tip, -L / 2 + 0.15);
  const c = document.createElement("canvas"); c.width = 128; c.height = 512;
  const g = c.getContext("2d");
  g.fillStyle = "#16162a"; g.fillRect(0, 0, 128, 512);
  for (const [i, col] of ["#ff2fa0", "#39ff88", "#ffe14d", "#2fd1ff", "#ff2fa0"].entries()) {  // neon zigzags down the board
    g.strokeStyle = col; g.lineWidth = 9; g.beginPath();
    for (let x = 0; x <= 128; x += 16) g.lineTo(x, 70 + i * 90 + (x / 16 % 2 ? 18 : -18));
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.repeat.set(1 / (2 * tip + 0.01), 1 / (L + 0.04)); t.offset.set(0.5, 0.5);  // extrude UVs are shape coordinates
  const deck = new THREE.Mesh(new THREE.ExtrudeGeometry(outline, { depth: 0.012, bevelEnabled: true, bevelThickness: 0.003, bevelSize: 0.003, bevelSegments: 2, curveSegments: 24 }),
    [new THREE.MeshStandardMaterial({ map: t, roughness: 0.35 }), new THREE.MeshStandardMaterial({ color: "#d9d9de", metalness: 0.6, roughness: 0.3 })]);  // top sheet, steel edges
  deck.castShadow = true;
  const board = new THREE.Group(); board.add(deck);
  const strap = new THREE.MeshStandardMaterial({ color: "#121216", roughness: 0.7 }), plate = new THREE.MeshStandardMaterial({ color: "#c43a6a", roughness: 0.5 });
  for (const [y, angle] of [[0.27, 0.3], [-0.27, -0.1]]) {  // bindings, angled like a regular stance
    const b = new THREE.Group(); b.position.set(0, y, 0.015); b.rotation.z = angle;
    b.add(mesh(new THREE.BoxGeometry(0.21, 0.11, 0.025), plate, 0, 0, 0.0125));             // baseplate
    b.add(mesh(new THREE.BoxGeometry(0.19, 0.025, 0.17), plate, 0, -0.06, 0.1, 0.2));        // highback
    for (const dy of [0.03, -0.025]) b.add(mesh(new THREE.BoxGeometry(0.21, 0.03, 0.035), strap, 0, dy, 0.085));  // straps
    b.traverse(m => { m.castShadow = true; }); board.add(b);
  }
  // turned to face the room from the corner (toward where you stand to look at it), leaning back into the corner
  board.position.set(3.5, L / 2 + 0.02, BACK + 0.4); board.rotation.order = "YXZ"; board.rotation.set(-0.14, -0.8, 0); scene.add(board);
  piece([board], "Snowboard", "leaning in the corner since the '90s", SPOTS.snowboard);

  const blades = new THREE.Group();
  const boot = new THREE.MeshStandardMaterial({ color: "#2a9d8f", roughness: 0.5 });
  const cuff = new THREE.MeshStandardMaterial({ color: "#5b2a86", roughness: 0.5 });
  const wheel = new THREE.MeshStandardMaterial({ color: "#ffe14d", roughness: 0.4 });
  for (const x of [-0.12, 0.12]) {
    const b = new THREE.Group();
    b.add(mesh(new THREE.BoxGeometry(0.11, 0.12, 0.3), boot, 0, 0.12, 0));
    b.add(mesh(new THREE.BoxGeometry(0.11, 0.16, 0.13), cuff, 0, 0.26, -0.08));
    for (let i = 0; i < 4; i++) b.add(mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.025, 16), wheel, 0, 0.035, -0.11 + i * 0.075, 0, 0, Math.PI / 2));
    b.position.x = x; b.rotation.y = x * 2; b.traverse(m => { m.castShadow = true; }); blades.add(b);
  }
  blades.position.set(2.7, 0, BACK + 0.4); blades.rotation.y = -0.5; scene.add(blades);
  piece([blades], "Rollerblades", "four wheels in a row, the only way to get around", SPOTS.rollerblades);
}

// a few slow motes of light drifting about: the "magical" part of the cabin
const motes = new THREE.Points(new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(
  Array.from({ length: 120 }, (_, i) => [((i * 97) % 80) / 10 - 4, ((i * 53) % 28) / 10 + 0.1, ((i * 31) % 80) / 10 - 4]).flat(), 3)),
  new THREE.PointsMaterial({ color: "#ffd38a", size: 0.03, transparent: true, opacity: 0.7, depthWrite: false }));
scene.add(motes);

// ---------- walking: walk.js turns input into a pose, room.js wires the page to it ----------
// ---------- reading an album: an overlay over the room, pages a spread at a time (one on a phone) ----------
const bookEl = document.getElementById("book"), photoEl = document.getElementById("photo"), spreadEl = bookEl.querySelector(".spread");
const perView = () => innerWidth < 700 ? 1 : 2;
let reading = null;  // { title, pages, pg } while a book is open
function openBook(name) {
  reading = { ...BOOKS[name], per: perView(), pg: pager(BOOKS[name].pages.length, perView()) };
  bookEl.classList.toggle("scrap", name === "scrapbook");
  document.getElementById("bookTitle").textContent = reading.title;
  bookEl.showModal(); render(0); bookEl.querySelector(".next").focus();
}
function render(dir) {
  const { pages, pg } = reading;
  spreadEl.replaceChildren(...pg.showing.map(i => {
    const page = document.createElement("div"); page.className = "page";
    pages[i].forEach((photo, k) => {
      const b = document.createElement("button"); b.style.setProperty("--tilt", `${((i * 7 + k * 5) % 7 - 3) * 0.6}deg`);
      b.setAttribute("aria-label", `open ${photo.note}`); b.dataset.ref = `${i}-${k}`;
      const img = new Image(); img.src = photo.src; img.alt = photo.note; img.loading = "lazy"; b.append(img);
      b.onclick = () => { photoEl.dataset.ref = b.dataset.ref; showPhoto(photo); }; page.append(b);
    });
    return page;
  }));
  spreadEl.style.setProperty("--from", `${dir * 40}px`); spreadEl.style.animation = "none"; void spreadEl.offsetWidth; spreadEl.style.animation = "";
  const s = pg.showing;
  bookEl.querySelector(".count").textContent = `page${s.length > 1 ? `s ${s[0] + 1}–${s.at(-1) + 1}` : ` ${s[0] + 1}`} of ${pages.length}`;
  bookEl.querySelector(".prev").disabled = !pg.canPrev; bookEl.querySelector(".next").disabled = !pg.canNext;
}
function showPhoto(photo) {
  photoEl.querySelector("img").src = photo.src; photoEl.querySelector("img").alt = photo.note;
  photoEl.querySelector("figcaption").textContent = photo.note; photoEl.showModal();  // closing it refocuses the photo's button
}
const turn = dir => { if (dir > 0 ? reading.pg.canNext : reading.pg.canPrev) { dir > 0 ? reading.pg.next() : reading.pg.prev(); render(dir); } };
bookEl.querySelector(".next").onclick = () => turn(1);
bookEl.querySelector(".prev").onclick = () => turn(-1);
bookEl.querySelector(".close").onclick = () => bookEl.close();
photoEl.querySelector(".close").onclick = () => photoEl.close();
bookEl.addEventListener("click", e => { if (e.target === bookEl) bookEl.close(); });  // outside the book
photoEl.addEventListener("click", e => { if (e.target === photoEl || e.target.tagName === "IMG") photoEl.close(); });
bookEl.addEventListener("close", () => { reading = null; });
// while reading, the walker's window listener never sees keydown (capture runs first); Escape still closes the top
// dialog, which is the browser's default action. Arrows turn the pages when the book is on top.
document.addEventListener("keydown", e => {
  if (!reading) return;
  e.stopPropagation();
  if (!photoEl.open && e.key === "ArrowRight") turn(1);
  else if (!photoEl.open && e.key === "ArrowLeft") turn(-1);
}, true);
// re-lay the book only when it goes between one page and two (a phone turning), not on every resize
addEventListener("resize", () => {
  if (!reading || perView() === reading.per) return;
  reading.per = perView(); reading.pg.view(reading.per); render(0);
});
// a photo opened before the book was re-laid has lost its button; give focus to the new one, or to Close if its page is no longer showing
photoEl.addEventListener("close", () => {
  if (spreadEl.contains(document.activeElement)) return;
  (spreadEl.querySelector(`[data-ref="${photoEl.dataset.ref}"]`) ?? bookEl.querySelector(".close")).focus();
});

const open = hinges();
let last = null;
walkThrough({ renderer, scene, camera, me: walker(START, CABIN), pieces,
  onTap: hit => {  // a tap on an album or the scrapbook opens it; on a drawer or door (or its knob) flips it
    let o = hit; while (o && !(o.name in BOOKS) && !OPENABLE.includes(o.name)) o = o.parent;
    if (o?.name in BOOKS) openBook(o.name); else if (o) open.toggle(o.name);
    return !!o;
  },
  onFrame: now => {
    motes.rotation.y = now * 0.00002; motes.position.y = Math.sin(now * 0.0004) * 0.05;
    const f = open.step(last === null ? 0 : (now - last) / 1000); last = now;
    for (const i of [0, 1, 2]) parts[`drawer${i}`].position.z = 0.285 + f[`drawer${i}`] * 0.36;
    parts.doorLeft.rotation.y = -f.doorLeft * 1.75; parts.doorRight.rotation.y = f.doorRight * 1.75;
  } });
</script>
</html>
